<title>Jargon Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one centered play column; top HUD (level, XP, streak), home menu of modes, one card at a time */
:root{--bg:#eef2f5;--surface:#fff;--ink:#12212e;--muted:#5a6b78;--line:#d3dde4;--accent:#0b6e8a;--accent-ink:#fff;--gold:#b86e00;--good:#1b7f4b;--goodbg:#e2f4ea;--bad:#b3261e;--badbg:#fbe7e5;
--fd:'Space Grotesk',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a23;--surface:#18262f;--ink:#e8f0f5;--muted:#9fb2bf;--line:#2c3f4c;--accent:#4cc3e0;--accent-ink:#06222c;--gold:#f0b04a;--good:#58d18c;--goodbg:#143427;--bad:#ff8a80;--badbg:#3a1c1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a23;--surface:#18262f;--ink:#e8f0f5;--muted:#9fb2bf;--line:#2c3f4c;--accent:#4cc3e0;--accent-ink:#06222c;--gold:#f0b04a;--good:#58d18c;--goodbg:#143427;--bad:#ff8a80;--badbg:#3a1c1a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:16px}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.7rem}h2{font-size:1.35rem}h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.hud{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.hud .lv{font-family:var(--fd);font-weight:700}
.bar{flex:1 1 140px;min-width:120px;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.chip{font-size:.8rem;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.chip.leave{border-color:var(--accent);color:var(--accent);cursor:pointer}
.chip.lostchip{color:var(--bad);border-color:var(--bad);background:var(--badbg)}
.lost{color:var(--bad);background:var(--badbg);border-radius:8px;padding:6px 10px}
.ptitle{margin:0;font-size:1.6rem;color:var(--accent);font-family:'Space Grotesk',Inter,system-ui,sans-serif;letter-spacing:.2px}
.gtitle{margin:0;font-size:1.35rem;color:var(--accent);font-family:'Space Grotesk',Inter,system-ui,sans-serif;letter-spacing:.2px}
.opt.flip{animation:flipy .75s ease-in-out}
@keyframes flipy{0%{transform:perspective(600px) rotateY(0)}100%{transform:perspective(600px) rotateY(360deg)}}
.opt .spell{display:block;font-weight:500;color:var(--muted);margin-top:2px}
.chip.gold{color:var(--gold);border-color:var(--gold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px;min-width:0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:grid;gap:4px}
.mode:hover{border-color:var(--accent)}
.mode b{font-family:var(--fd);font-size:1.05rem}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 11px;font-size:.85rem}
.cats button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.term{font-family:var(--fd);font-size:2rem;font-weight:700;overflow-wrap:anywhere}
.tag{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--goodbg);border-color:var(--good)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.fb.ok{background:var(--goodbg)}.fb.no{background:var(--badbg)}
.learn{display:grid;gap:10px}
.learn div{border-left:3px solid var(--accent);padding-left:12px}
.learn .k{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.timer{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.bubble{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;font-style:italic}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--fd);font-size:1.4rem;font-variant-numeric:tabular-nums}
.mast{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:4px}
.mast i{display:block;height:100%;background:var(--good)}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:.9rem}
.dots .d{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--line);margin-right:4px;vertical-align:middle}.dots .d.on{background:var(--gold)}
.tray{min-height:54px;border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;background:var(--bg)}.bankrow{display:flex;flex-wrap:wrap;gap:6px}.tile{touch-action:none;user-select:none;-webkit-user-select:none;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;overflow-wrap:anywhere}.tile:hover:not(:disabled){border-color:var(--accent)}.tile.used{opacity:.25}.tile.right{background:var(--goodbg);border-color:var(--good)}.tile.wrong{background:var(--badbg);border-color:var(--bad)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.stile{font:inherit;text-align:left;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center}.stile:hover{border-color:var(--accent)}.stile[aria-pressed=true]{border-color:var(--accent);background:var(--surface);box-shadow:inset 0 0 0 1px var(--accent)}.st-name{font-size:.85rem;font-weight:600;line-height:1.2;overflow-wrap:anywhere}.st-count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}.st-bar{grid-column:1/-1;display:block;height:5px;margin-top:3px}.spanel{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;display:grid;gap:8px}.sp-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 14px}.sc-term{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:5px;min-width:0}.sc-t{font-weight:500;font-size:.9rem;overflow-wrap:anywhere;min-width:0}.pills{display:flex;flex-wrap:wrap;gap:3px}.pill{font-size:.7rem;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}.pill.on{color:var(--gold);border-color:var(--gold);font-weight:600}
button.chip{cursor:pointer;color:var(--ink)}
.nbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;flex:1 1 140px}input[type=range]{flex:1 1 120px;min-width:100px;accent-color:var(--accent)}label{display:inline-flex;gap:6px;align-items:center}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}#voicesel{flex:1 1 200px;min-width:0}
.tile.ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 8px 20px rgba(0,0,0,.3);border-color:var(--accent)}.insbar{width:4px;min-height:34px;align-self:stretch;border-radius:2px;background:var(--accent);flex:none}.tile:not(:disabled){cursor:grab}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .3s}@keyframes pop{from{transform:scale(.97);opacity:.5}to{transform:none;opacity:1}}

.sec{font-size:1.15rem;margin-top:4px}
.hav{padding:0;border:0;background:none;cursor:pointer;border-radius:16px;line-height:0}
.havbig{padding:0;border:0;background:none;cursor:pointer;line-height:0;border-radius:16px}
.hav:focus-visible,.havbig:focus-visible,.wopt:focus-visible,.sw:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.trow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 220px;min-width:0;display:grid;gap:8px}
.goalbar,.rap{height:12px;background:var(--line);border-radius:7px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--gold);transition:width .5s}
.rap i{display:block;height:100%;background:var(--accent);transition:width .4s}
.toasts{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom,0px));display:grid;gap:8px;justify-items:center;pointer-events:none;z-index:50;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;max-width:100%;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:tin .3s ease}
.toast.level,.toast.trophy,.toast.trusted,.toast.goal{background:var(--gold);color:var(--accent-ink)}
@keyframes tin{from{transform:translateY(14px);opacity:0}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.bar i,.goalbar i,.rap i{transition:none}}
.wdtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.wdgrid{display:flex;flex-wrap:wrap;gap:8px}
.wopt{font:inherit;font-weight:600;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:44px;text-align:left}
.wopt[aria-pressed="true"]{border-color:var(--accent);background:var(--goodbg)}
.wopt:disabled{opacity:.65;cursor:not-allowed}
.wopt small{display:block;font-weight:500;color:var(--muted)}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}
.quote{border-left:4px solid var(--accent);padding:8px 12px;background:var(--bg);border-radius:0 8px 8px 0}
.tstrip{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:.85rem}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tcard{display:flex;gap:10px;align-items:center;border:1px solid var(--gold);border-radius:10px;padding:8px 10px;background:var(--bg);min-width:0}
.tcard.lock{border-color:var(--line);opacity:.75}
.tdet summary{cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:700;font-size:1.15rem;min-height:44px;list-style-position:inside}
.tdet summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.timerow{display:grid;grid-template-columns:minmax(110px,1.2fr) 1fr auto;gap:10px;align-items:center;padding:4px 0}
.tbar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--accent)}
.tval{text-align:right;white-space:nowrap}.tval small{display:block;color:var(--muted)}
@media (max-width:420px){.timerow{grid-template-columns:1fr auto}.tbar{grid-column:1/-1;order:3}}
.pack-terms{display:flex;flex-wrap:wrap;gap:6px}
</style>
<body>
<div class="wrap" id="app"></div>
<script>
var CATS=["Cybersecurity","Unified Communications","Contact Center","AI","Collaboration","Customer Experience","Compliance","Data Center & Cloud","Managed IT","Network Transformation","Lifecycle Management","Real Client Terms","Infrastructure & IoT","Advisor & Buying"];
// [category, term, spelled out, plain English, business problem it solves, question to ask the client]
var T=[
["Cybersecurity","MFA","Multi-Factor Authentication","Logging in needs two or more proofs of identity, like a password plus a code on your phone.","Stolen passwords let criminals walk in the front door.","Do all employees, including executives and remote staff, use a second login step today?"],
["Cybersecurity","EDR","Endpoint Detection and Response","Software on laptops and servers that watches for suspicious behavior and can isolate an infected machine.","Old antivirus misses modern attacks, so breaches go unnoticed for weeks.","What protects your laptops today, and who watches the alerts after hours?"],
["Cybersecurity","SIEM","Security Information and Event Management","One dashboard that collects logs (activity records) from all systems and flags patterns that look like an attack.","Clues about an attack are scattered across many tools and nobody connects them.","If something odd happened last night, how would you find out and how long would it take?"],
["Cybersecurity","SOC","Security Operations Center","A team (in-house or outsourced) that watches for threats around the clock.","Attacks happen at 2 a.m. and a small IT team is asleep.","Does anyone monitor security alerts nights and weekends?"],
["Cybersecurity","Zero Trust","Zero Trust security model","Never trust a user or device automatically, even inside the office. Verify every request.","Once an attacker is inside a traditional network, they can roam freely.","How do you control what a person or device can reach once it is on your network?"],
["Cybersecurity","Ransomware","Malicious software that locks files for payment","Criminals encrypt your data and demand money to unlock it.","Downtime, lost data and ransom payments can threaten the whole business.","If all your files were locked tomorrow, how fast could you restore them?"],
["Unified Communications","UC","Unified Communications","Phone calls, video meetings and chat combined into one system and one app.","Staff juggle separate tools, which wastes time and drops conversations.","How many different tools do people use to call, meet and message?"],
["Unified Communications","UCaaS","Unified Communications as a Service","UC delivered over the internet by a provider for a monthly fee, instead of a phone system in a closet.","Aging on-site phone systems are costly to maintain and hard to use remotely.","How old is your phone system and when does the contract or support end?"],
["Unified Communications","VoIP","Voice over Internet Protocol","Phone calls carried over the internet instead of traditional phone lines.","Old phone lines are expensive and tied to one building.","Are you still paying for traditional phone lines at any locations?"],
["Unified Communications","SIP Trunk","Session Initiation Protocol trunk","A virtual phone line that connects your phone system to the public phone network over the internet.","Physical phone lines cost more and are hard to scale up or down.","How many phone lines do you pay for, and do you use them all?"],
["Unified Communications","PBX","Private Branch Exchange","The traditional business phone system that routes calls inside a company.","On-site PBX hardware ages, breaks and needs specialists.","Is your phone system on-site or in the cloud, and who supports it?"],
["Contact Center","CCaaS","Contact Center as a Service","Cloud software that runs a customer service team: calls, chat, email and text in one place.","Customers get bounced around and agents lack the full picture.","Which channels do customers use to reach you, and are they managed in one system?"],
["Contact Center","IVR","Interactive Voice Response","The automated phone menu: 'Press 1 for billing.'","Customers hate long menus and agents waste time on simple requests.","What share of callers could solve their issue without a person?"],
["Contact Center","ACD","Automatic Call Distributor","Software that routes each incoming call to the best available agent.","Calls land with the wrong person or wait too long.","How do you decide which agent gets which call?"],
["Contact Center","Omnichannel","Many channels, one connected conversation","A customer can start on chat, move to phone, and the agent still sees the history.","Customers repeat themselves every time they switch channel.","Do agents see past conversations when a customer switches channel?"],
["Contact Center","AHT","Average Handle Time","The average minutes an agent spends on one customer interaction.","Long handle times mean higher costs and longer waits.","What is your average handle time and what drives it up?"],
["Contact Center","WFM","Workforce Management","Tools that forecast call volume and schedule the right number of agents.","Too few agents means long waits; too many wastes payroll.","How do you schedule agents for busy and quiet periods?"],
["AI","AI","Artificial Intelligence","Software that performs tasks that normally need human judgment, such as understanding language or spotting patterns.","Repetitive work and information overload slow people down.","Where does your team spend time on repetitive tasks?"],
["AI","LLM","Large Language Model","The kind of AI behind chat assistants. It reads and writes text after learning from huge amounts of writing.","Staff spend hours drafting, summarizing and searching for answers.","What documents or questions eat up the most staff time?"],
["AI","Generative AI","AI that creates new content","AI that writes text, images or code on request.","Creating first drafts and summaries is slow.","Is anyone using AI tools at work today, approved or not?"],
["AI","Virtual Agent","An AI-powered chatbot or voice bot","A bot that handles routine customer questions without a person.","Agents are swamped with simple repeat questions.","What are the top five questions customers ask?"],
["AI","Hallucination","When AI states something false with confidence","The AI makes up an answer that sounds right but is wrong.","Wrong answers can mislead customers or break rules.","How would you check AI answers before customers see them?"],
["AI","RAG","Retrieval-Augmented Generation","AI looks up your own approved documents first, then answers from them.","Generic AI knows nothing about your products or policies.","Where do your policies and product knowledge live today?"],
["Collaboration","Collaboration","Working together across people and places","Tools for chat, shared files, meetings and shared projects.","Teams in different places cannot work from the same information.","How do teams share files and decisions today?"],
["Collaboration","Teams / Webex / Zoom","Common meeting and chat platforms","Apps for video meetings, group chat and screen sharing.","Meetings are hard to join and rooms lack the right equipment.","Which meeting tools are in use, and are the meeting rooms set up for hybrid work?"],
["Collaboration","Hybrid Work","Mix of office and remote work","Some people are in the office and some at home on any given day.","Remote staff feel left out and tools were built for one location.","How many days a week are people in the office?"],
["Collaboration","Huddle Room","A small meeting room with video gear","A room for 2 to 6 people with a screen, camera and microphone.","Quick video calls take over open desks and conference rooms.","How many meeting rooms have video equipment?"],
["Collaboration","Shadow IT","Tools staff use without IT approval","People sign up for their own apps because the official ones fall short.","Company data ends up in unsecured tools.","Are staff using their own apps to share files or chat?"],
["Customer Experience","CX","Customer Experience","How a customer feels about every interaction with your company.","Frustrated customers leave and tell others.","How do you measure customer satisfaction today?"],
["Customer Experience","CSAT","Customer Satisfaction Score","A quick survey rating, such as 'How satisfied were you today?'","Without feedback you do not know what is broken.","Do you survey customers after interactions, and what do you do with the answers?"],
["Customer Experience","NPS","Net Promoter Score","A score of how likely customers are to recommend you.","Leaders need one number to track loyalty over time.","What is your NPS and has it moved this year?"],
["Customer Experience","CRM","Customer Relationship Management","Software that stores customer records and history, such as Salesforce.","Customer details live in spreadsheets and inboxes.","Which CRM do you use and is it connected to your phone system?"],
["Customer Experience","Customer Journey","Every step a customer takes with you","The path from first contact to purchase to support.","Gaps in the path cause customers to drop off.","Where do customers get stuck or complain most?"],
["Compliance","Compliance","Following laws and industry rules","Proving that you handle data and operations the way regulators require.","Failing an audit means fines, lost customers and legal risk.","Which regulations apply to your business?"],
["Compliance","HIPAA","Health Insurance Portability and Accountability Act","US law protecting patient health information.","Healthcare data leaks bring heavy fines.","Do you handle patient information, and where is it stored and sent?"],
["Compliance","PCI DSS","Payment Card Industry Data Security Standard","Rules for anyone who accepts or stores credit card data.","Mishandled card data brings fines and lost ability to take cards.","Do agents ever hear or type card numbers on calls?"],
["Compliance","SOC 2","System and Organization Controls 2","An audit report showing a provider protects customer data properly.","Customers ask for proof you are secure before they sign.","Do your customers or vendors ask for a SOC 2 report?"],
["Compliance","GDPR","General Data Protection Regulation","European Union privacy law for people's personal data.","Fines are large if you mishandle EU residents' data.","Do you serve customers in Europe?"],
["Compliance","Call Recording","Recording customer conversations","Saving calls for training, disputes and legal rules.","Some industries must keep records, and others must get consent.","How long do you keep recordings and who can access them?"],
["Data Center & Cloud","Cloud","Computing delivered over the internet","Renting servers and software from a provider instead of owning them.","Buying and running your own hardware is costly and slow to change.","What runs in your own building versus in the cloud?"],
["Data Center & Cloud","Data Center","A facility full of servers and storage","The room or building where company systems physically live.","Running one is expensive: power, cooling, security and staff.","Do you own a server room or data center and when is the hardware due for replacement?"],
["Data Center & Cloud","IaaS / PaaS / SaaS","Infrastructure, Platform, Software as a Service","Three levels of renting: raw servers, a place to build apps, or finished software.","Companies pay for more control than they need.","Which applications could simply be rented as software?"],
["Data Center & Cloud","Hybrid Cloud","Mix of on-site and cloud systems","Some workloads stay in your building and some run in the cloud.","Not everything can or should move to the cloud.","Which systems must stay on-site and why?"],
["Data Center & Cloud","Colocation","Renting space in someone else's data center","Your own servers sit in a professional facility.","You get power and security without building a data center.","Would you rather stop running your own server room?"],
["Data Center & Cloud","DR / BCP","Disaster Recovery / Business Continuity Plan","The plan to get systems and operations back after an outage or disaster.","A fire, flood or attack can stop the business.","When did you last test restoring your systems, and how long did it take?"],
["Managed IT","MSP","Managed Service Provider","An outside company that runs your IT for a monthly fee.","Small IT teams are overwhelmed and cannot cover every need.","How big is your IT team and what do they not have time for?"],
["Managed IT","SLA","Service Level Agreement","A contract promise on response times and uptime.","Without one, nobody is accountable when things break.","What response time do you expect when something goes down?"],
["Managed IT","Help Desk","Support for staff tech problems","The team employees contact when their computer or app fails.","Lost productivity while people wait for fixes.","Who do staff call when something breaks and how long does it take?"],
["Managed IT","RMM","Remote Monitoring and Management","Tools that watch and fix computers remotely before users notice.","Problems are discovered only after people complain.","How do you know a machine is failing before it fails?"],
["Managed IT","Patch Management","Installing software security updates","Keeping systems current so known holes are closed.","Unpatched systems are a favorite entry point for attackers.","Who applies updates and how do you know they are done?"],
["Managed IT","Vendor Management","Handling many technology suppliers","Managing contracts, renewals and support calls across providers.","Dozens of vendors means missed renewals and finger-pointing.","How many technology vendors do you work with?"],
["Network Transformation","WAN","Wide Area Network","The links that connect your offices, plants and data centers.","Slow or costly links hurt every location.","How are your sites connected and what do you pay?"],
["Network Transformation","SD-WAN","Software-Defined Wide Area Network","Smart software that steers traffic across several internet links to keep apps fast and reliable.","Costly private circuits and slow cloud apps.","Which locations have performance or outage problems?"],
["Network Transformation","SASE","Secure Access Service Edge (said 'sassy')","Networking and security delivered together from the cloud.","Remote users and branches are hard to protect with old tools.","How do remote workers connect securely to company systems?"],
["Network Transformation","MPLS","Multiprotocol Label Switching","A private, reliable but pricey type of network circuit.","Costs are high and it is slow to add sites.","Are you on MPLS and when do those contracts end?"],
["Network Transformation","LAN / Wi-Fi","Local Area Network","The wired and wireless network inside one building.","Weak Wi-Fi frustrates staff and customers.","Any coverage dead spots or slow areas in your buildings?"],
["Network Transformation","Bandwidth","Capacity of a network connection","How much data can flow at once, like lanes on a highway.","Too little causes slow video and cloud apps.","Have you noticed slow or choppy video calls?"],
["Lifecycle Management","Lifecycle Management","Tracking technology from purchase to retirement","Planning when equipment and contracts are bought, renewed, upgraded and retired.","Surprise expirations and old equipment cause outages and emergency spending.","Do you have one list of all technology, contract end dates and costs?"],
["Lifecycle Management","EOL / EOS","End of Life / End of Support","The date a vendor stops selling or fixing a product.","Unsupported gear gets no security fixes.","Is any equipment past, or nearing, its end of support date?"],
["Lifecycle Management","TCO","Total Cost of Ownership","The full cost of something over its life, not just the price tag.","A cheap purchase can cost more in support and downtime.","What does your current setup cost per year including staff time?"],
["Lifecycle Management","Tech Refresh","Planned replacement of old equipment","Replacing hardware on a regular schedule.","Aging hardware slows people down and fails.","How old are laptops, servers and network gear?"],
["Lifecycle Management","Renewal","Contract coming up for extension","The point where a service contract ends or auto-extends.","Missed renewal dates lock you into bad terms.","Which contracts renew in the next 6 to 12 months?"],
["Lifecycle Management","Asset Inventory","A list of all technology assets","A record of every device, license and circuit you own.","You cannot protect or plan what you cannot see.","Who owns the list of what you have and how current is it?"],
["Real Client Terms","OT","Operational Technology","The machines and control systems that run physical production, like factory lines, as opposed to office computers.","Factory equipment is cut off from business systems, so nobody sees production in one place.","Which production lines are the priority, and what controls them today?"],
["Real Client Terms","PLC","Programmable Logic Controller","A rugged mini-computer that runs one machine or line. Many are old and have no network connection.","The machine cannot share its data without a workaround.","Do the controllers have network ports, and which brands and models are they?"],
["Real Client Terms","IT/OT Convergence","Joining office IT and factory OT","Connecting factory equipment to the business network so both sides share data safely.","Production and business teams work from different, disconnected information.","Who owns factory systems today, IT or the plant, and do they work together?"],
["Real Client Terms","Industrial Gateway","A translator box for machines","A small device that reads a machine's own protocol and passes the data to the normal network.","Equipment with proprietary connections cannot be replaced cheaply.","Which equipment speaks a proprietary language, and can it stay in place?"],
["Real Client Terms","ERP","Enterprise Resource Planning","The core business software for orders, inventory and finance. SAP and Oracle are examples.","Business teams cannot see what production is actually doing.","Which ERP systems do you run, and which teams use each?"],
["Real Client Terms","MES","Manufacturing Execution System","Software that schedules and tracks work on the factory floor and links it to the ERP.","Schedules are sent to lines by hand and reports are copied manually.","How are production schedules and reports moved today, and by whom?"],
["Real Client Terms","Data Silo","Data trapped in one system or team","Information that only one group can see or use.","Decisions are slow because teams cannot see each other's data.","Which two teams most need each other's data?"],
["Real Client Terms","Private Cloud","Cloud dedicated to one company","Cloud-style computing run only for your company, in your own or a hosted data center.","You want cloud flexibility with tight control over data.","Who operates it, and what do you want it to do that it cannot today?"],
["Real Client Terms","RTO / RPO","Recovery Time Objective / Recovery Point Objective","RTO is how fast systems must be back after an outage. RPO is how much recent data you can afford to lose.","Without targets, a disaster plan cannot be judged.","If a data center failed, how quickly must each system return and how much data loss is acceptable?"],
["Real Client Terms","POS","Point of Sale","The register system that rings up sales and records them.","A bad POS setting can quietly mis-record every sale.","What happens after a POS update, and who checks that it still works?"],
["Real Client Terms","Anomaly Detection","Software that spots unusual patterns","Analytics that learns what normal looks like and alerts you when something changes.","Problems go unnoticed for weeks because nobody watches the numbers.","What is the longest a problem has gone unnoticed, and what did it cost?"],
["Real Client Terms","Price Optimization","Using data to set better prices","Analytics that suggest prices based on local demand and competitor prices.","Uniform prices leave money on the table in some markets.","How are prices set today, and could they differ by market?"],
["Real Client Terms","API","Application Programming Interface","A standard way for one piece of software to ask another for data.","Connecting systems by hand is slow and error-prone.","Which systems can share data, and who maintains the connections?"],
["Real Client Terms","Data Platform","One place to collect and analyze data","Software that pulls data from many systems into one place for reports and analytics.","Data lives in many tools, so nobody gets the full picture.","Which data sources matter most, and what decision would you make with them first?"],
["Real Client Terms","Build vs Buy","Make it yourself or purchase a service","Deciding whether to develop software in-house or subscribe to a vendor's.","Custom builds take long and need skills the team may lack.","Do you have the people and time to build and maintain it?"],
["Real Client Terms","Tribal Knowledge","Know-how kept only in people's heads","Important rules and judgment that are not written down or in any system.","When a key person leaves, the know-how leaves too.","Which decisions depend on one or two people's experience?"],
// From the Dale Alsobrook Industry Jargon Study Guide (Bridgepointe, November 2026)
["Unified Communications", "PRI", "Primary Rate Interface", "A traditional digital phone line, usually carrying 23 voice channels in the U.S., that connects an office phone system to the phone network.", "Many multi-site companies still pay for phone lines they no longer need.", "How many PRI circuits do you pay for, and how many calls do you actually have at once at peak?"],
["Unified Communications", "PSTN", "Public Switched Telephone Network", "The regular public phone network that connects calls between carriers and countries. Even cloud phones still reach it.", "Teams assume going cloud means leaving the phone network, then outside calls and 911 surprise them.", "Which outside, emergency and vendor numbers must your phones reach, and who carries them today?"],
["Unified Communications", "DID", "Direct Inward Dial", "A phone number that rings a specific person, team or device directly instead of going through a receptionist first.", "Nobody knows which numbers are in use, so a migration drops an important line.", "How many direct numbers do you have, who owns each one, and which must stay in service during a move?"],
["Unified Communications", "QoS", "Quality of Service", "Network settings that give voice and video priority so calls stay clear when the connection is busy.", "Calls sound choppy after a move to a cloud phone system.", "After the move, do calls break up, and is priority for voice set up on your network and Wi-Fi?"],
["Unified Communications", "E911", "Enhanced 911 with dispatchable location", "Emergency calling rules that send the right address, often down to a floor or suite, with every 911 call.", "Moving phones to the cloud can send emergency responders to the wrong place.", "How will 911 get the correct location for every office, and what is the backup path if a site's internet is down?"],
["Unified Communications", "CPaaS", "Communications Platform as a Service", "Building blocks, usually APIs, that let a company add calling, texting or video into its own apps.", "A product team wants texting or in-app calling without buying a whole phone system.", "What do you want customers to be able to do inside your own app: text, call, get alerts?"],
["Unified Communications", "Number Porting", "Local number portability, often just called porting", "Moving existing phone numbers from one provider to another so people keep the numbers they already have.", "A missed fax, alarm or overflow number can stall a cutover.", "Which numbers must port on day one, including fax, alarm and any line that looks unused on the bill?"],
["Unified Communications", "Auto-Attendant", "Automated attendant, also called a phone tree", "The recorded greeting and menu that answers the main number, such as 'press 1 for sales'.", "Callers get lost in menus, or after-hours calls go nowhere.", "Walk me through what happens after someone dials your main number, including after hours and overflow."],
["Unified Communications", "Softphone", "Software telephone", "A phone that runs as an app on a laptop or mobile device instead of a physical desk phone.", "Hybrid staff are tied to desk phones in an office they rarely visit.", "Do people still need desk phones, or can they work from a headset and the app from anywhere?"],
["Unified Communications", "Teams Phone", "Microsoft Teams Phone and Operator Connect", "A way to add business calling to Microsoft Teams so staff make and receive phone calls in the app they already use for chat and meetings.", "Staff juggle Teams for chat and meetings plus a separate phone system.", "Since you already use Microsoft 365, do you want calling inside Teams or a separate cloud phone tool, and who provides the calling path?"],
["Contact Center", "FCR", "First Contact Resolution", "The share of customer issues fully solved in the first interaction, with no callback, transfer or repeat contact.", "Short calls look efficient while customers keep calling back about the same problem.", "What share of issues get solved on the first contact, and how do you measure it?"],
["Contact Center", "ACW", "After-Call Work", "The notes and system updates an agent completes after the customer interaction ends.", "Wrap-up time quietly eats minutes on every single call.", "How long does wrap-up take after a typical call, and what does the agent have to type in?"],
["Contact Center", "Agent Assist", "Agent-assist AI", "AI that helps a live human during or after a conversation by suggesting answers, surfacing knowledge or summarizing the call.", "New employees are slow to answer and wrap-up work piles up.", "Where do your people lose the most time during and after a conversation today?"],
["Contact Center", "Quality Management", "Quality management or quality assurance (QM or QA)", "Reviewing conversations, scoring performance and coaching people, now also applied to AI that talks to customers.", "Only a tiny sample of conversations is ever reviewed.", "Do you score a small sample of calls, or can you evaluate every conversation, including ones handled by automation?"],
["Contact Center", "Speech Analytics", "Speech and text analytics", "Tools that scan calls and chats at scale to find why customers contact you, how they feel and where compliance or coaching problems hide.", "Leaders have no idea why repeat contacts are rising.", "What do you know today about why customers contact you, beyond what people tag by hand?"],
["Contact Center", "AI Agent", "AI agent or virtual agent", "Software that can talk with a customer and finish multi-step work, such as verifying identity, checking an order or updating a record.", "A basic bot answers questions but cannot finish anything, so people still do all the work.", "What is the AI allowed to finish on its own, and when must it hand off to a person with the full context?"],
["AI", "Agentic AI", "Agentic AI and agentic CCaaS", "AI that takes multi-step actions toward a goal instead of only answering questions, and contact center platforms built around it.", "Simple bots deflect questions but do not resolve work, so volume stays high.", "Which tasks are you willing to let software finish, and how will you test and score it the way you score people?"],
["AI", "AI Governance", "AI governance and shadow AI", "The rules for approving and monitoring AI, plus the problem of staff using unapproved AI tools on their own.", "Employees paste company data into public AI tools that nobody approved.", "Which AI tools are approved, what data is forbidden to paste into them, and who is accountable for that policy?"],
["Network Transformation", "DIA", "Dedicated Internet Access", "An internet circuit with capacity reserved for one customer, usually with matching upload and download speed and a real uptime promise.", "Shared business internet slows down at peak hours and comes with no guarantee.", "Is this quote truly dedicated with a written SLA, or shared broadband with a similar label?"],
["Network Transformation", "Broadband", "Business broadband, often cable or shared fiber", "Internet that shares capacity with neighbors, costs less than dedicated service and usually has a weaker or no uptime promise.", "A small site depends on a cheap line with no guarantee.", "Would slow peak hours, weak upload speed or no SLA hurt voice, payments or cloud apps at this site?"],
["Network Transformation", "5G FWA", "5G Fixed Wireless Access", "Business internet delivered over a carrier's 5G or 4G cell network to a fixed antenna at the site, with no trench to dig.", "Fiber installs take months or are not available at a site.", "What upload speed does the site need, and is there strong coverage at that exact address?"],
["Network Transformation", "Dark Fiber", "Unlit optical fiber", "Unlit glass strands between two points that you lease and light with your own equipment, for very high capacity and control.", "Heavy traffic between two sites outgrows ordinary circuits.", "How far apart are the sites, who would maintain the glass, and do you have staff to run the optical equipment?"],
["Network Transformation", "Wavelength", "Wavelength service, sometimes called a wave", "A private slice of light on a carrier's network, typically 10, 100 or 400 Gbps, used as high-capacity transport.", "Large steady data flows between data centers strain shared internet.", "Are these large steady flows between data centers, and would you rather rent a private slice than run your own glass?"],
["Network Transformation", "Last Mile", "The last-mile or access circuit", "The final stretch of connection from the provider's network into the customer's building, often the slowest part of an install.", "A simple circuit takes 90 to 120 days to install.", "Who owns the path into the building, and is the building already connected to that provider?"],
["Network Transformation", "Demarc", "Demarcation point", "The exact point where the carrier's responsibility ends and the customer's own wiring and equipment begin.", "In an outage, the carrier and the customer's vendor blame each other.", "Where is the demarc at each site, and do you have photos or a diagram of it?"],
["Network Transformation", "Latency and Jitter", "Latency is delay; jitter is variation in delay", "Latency is how long data takes to travel. Jitter is how much that delay jumps around, which makes voice sound choppy.", "Calls and video are choppy even though speed tests look fine.", "When Teams or phone calls break up, what are your latency, jitter and packet loss numbers, not just download speed?"],
["Network Transformation", "Packet Loss", "Packet loss", "Data that never arrives. Even small amounts freeze video and drop words in a call.", "A circuit looks up but voice on it is unusable.", "Does the circuit lose data during bad calls, or only when it is completely down?"],
["Network Transformation", "Carrier Diversity", "Failover and carrier diversity", "Failover is the automatic switch to a backup path. Real diversity means the backup uses a different carrier, route and building entrance.", "Two circuits share one conduit, so one backhoe cuts both.", "If a backhoe cuts the primary fiber, does the backup use a different carrier, path and building entrance?"],
["Network Transformation", "On-Net vs Off-Net", "On-network versus off-network", "On-net means the provider already has cable into the building. Off-net means it must rent another carrier's access.", "Quotes for some sites take longer and cost more than others.", "For each site, is the provider already in the building or renting someone else's access?"],
["Network Transformation", "BGP", "Border Gateway Protocol", "The routing method that lets networks tell each other the best path, used when a company wants control over how traffic enters and leaves.", "Failing over between two internet providers drops connections or forces address changes.", "Do you need your own address space and BGP so you can fail over between carriers without changing addresses?"],
["Network Transformation", "Oversubscription", "Oversubscription", "Selling more shared capacity than the network could deliver if every customer used it at the same moment.", "Service is fine at night and slow at peak hours.", "How does the provider handle peak usage, and what speed is actually guaranteed?"],
["Data Center & Cloud", "Hyperscaler", "Public cloud and hyperscaler", "Public cloud is computing rented from a provider over the internet. Hyperscalers are the very largest, such as AWS, Microsoft Azure and Google Cloud.", "A company uses several clouds with no clear owner.", "Which public clouds do you already use, was that a strategy or just how a project started, and who owns cost and design?"],
["Data Center & Cloud", "Multi-Cloud", "Multi-cloud", "Using more than one public cloud provider on purpose, to place workloads where they fit or avoid depending on a single vendor.", "Different teams picked different clouds and nobody can see the whole picture.", "Can you actually operate, secure and see the cost across all those clouds, or did it just happen?"],
["Data Center & Cloud", "Carrier-Neutral Data Center", "Carrier-neutral facility", "A data center that lets many network providers compete inside the building instead of forcing tenants onto one.", "A tenant is locked into one provider's pricing inside the facility.", "How many carriers are in the meet-me room, what does a cross-connect cost, and are cloud on-ramps available?"],
["Data Center & Cloud", "Cross-Connect", "Cross-connect and meet-me room (MMR)", "A cable inside a data center linking your cabinet to a carrier, a cloud or another tenant. The meet-me room is where those networks meet.", "Small monthly connection fees quietly multiply.", "How many connections will you need in year two, not just on day one, and what does each cost per month?"],
["Data Center & Cloud", "FinOps", "Financial Operations", "A shared practice that lets engineering, finance and the business see, divide up and trim variable cloud spending.", "The cloud bill is a surprise every month.", "Who owns the cloud bill today, can teams see their own spend, and does anyone review idle resources and egress charges?"],
["Data Center & Cloud", "Cloud Egress", "Cloud egress fees, also called data transfer out", "The charges a cloud provider bills when your data leaves its network.", "A workload that looks cheap to run becomes expensive to leave or to back up.", "How much data moves out of the cloud each month, and where does it go?"],
["Data Center & Cloud", "Cloud On-Ramp", "A private connection into a public cloud", "A dedicated path from a data center or network into a public cloud, for lower delay and often lower transfer cost than the public internet.", "Traffic to the cloud is slow, unpredictable and costly over the open internet.", "Does a private on-ramp already exist in your colo, or can it be ordered as a cross-connect instead of a new network project?"],
["Data Center & Cloud", "Cloud Repatriation", "Cloud repatriation", "Moving some workloads from public cloud back onto equipment you own or rent space for, usually for cost, speed or control.", "Some steady workloads cost far more in the cloud than they would at home.", "Which workloads never used the flexibility you pay for, and what does a fair three-year cost comparison show?"],
["Data Center & Cloud", "Bare Metal", "Bare-metal server", "A physical server rented to one customer only, with no other tenants on that machine.", "A demanding or license-sensitive application struggles on shared cloud servers.", "Do you need a whole dedicated machine, or would isolated cloud instances be enough?"],
["Data Center & Cloud", "Remote Hands", "Remote hands, a colocation service", "On-site technicians at a data center who reboot a server, reseat a cable or swap a drive for you.", "Staff must drive to the data center for small fixes.", "Are remote hands billed hourly or as a bundle, and how fast do they respond after hours?"],
["Data Center & Cloud", "N+1 / 2N", "N+1 and 2N redundancy", "Ways to describe backup capacity. N+1 means one spare beyond what is needed. 2N means a fully separate duplicate.", "A facility is sold as highly available with no detail behind the claim.", "When a provider says highly available, do they mean N+1 or 2N, and does your own design match?"],
["Data Center & Cloud", "PUE", "Power Usage Effectiveness", "A data center efficiency score: total facility power divided by the power that reaches computing equipment. Lower is better.", "Facilities get compared on a single flashy number.", "Beyond efficiency scores, how much usable power is there, at what cost per kilowatt, and which carriers are inside?"],
["Cybersecurity", "ZTNA", "Zero Trust Network Access", "Access to specific applications only after checking identity and device health, instead of putting users onto the whole network like a VPN.", "One stolen password opens the entire network.", "Which apps are in scope, are contractors included, and what happens when a lost or unhealthy laptop is blocked?"],
["Cybersecurity", "SSE", "Security Service Edge", "The security half of SASE, such as zero trust access, web filtering and cloud app control, without the networking half.", "A company likes its current network but wants cloud-delivered security.", "Do you want to keep your current network and add cloud security, or replace both together?"],
["Cybersecurity", "FWaaS", "Firewall as a Service", "Firewall protection delivered from the cloud instead of a physical firewall box in every office.", "Branch offices each need a firewall box that someone has to manage.", "How many firewall boxes do you manage today, and who keeps them updated?"],
["Cybersecurity", "SWG", "Secure Web Gateway", "A control that inspects and filters internet traffic, including from remote users, and blocks dangerous sites and downloads.", "Remote staff browse the internet with no filtering at all.", "When staff are off the office network, is their web traffic still filtered?"],
["Cybersecurity", "CASB", "Cloud Access Security Broker", "A control between users and cloud apps that shows which apps are in use, enforces rules and stops data leaking into unapproved tools.", "Nobody knows which cloud apps employees use or what data goes into them.", "Do you know which cloud and AI tools employees use, and what data is going into them?"],
["Cybersecurity", "XDR / MDR", "Extended Detection and Response / Managed Detection and Response", "XDR watches devices, email, identity and network together. MDR is a service where outside analysts watch and respond for you around the clock.", "A small IT team cannot watch security alerts at 2 a.m.", "Which security tools do you already own, and is anyone actually staffing the alerts around the clock?"],
["Cybersecurity", "CSPM", "Cloud Security Posture Management", "Tools that continuously look for cloud misconfigurations and risky exposures.", "An open storage bucket exposes data and nobody notices.", "Who checks your cloud settings today, and how soon would a mistake be noticed?"],
["Cybersecurity", "DDoS Mitigation", "Distributed Denial of Service mitigation", "Defenses that absorb or filter floods of junk traffic so a website or internet connection stays up during an attack.", "Attackers knock a customer-facing site offline.", "Has a site or phone path ever been knocked offline by a flood of traffic, and what protects it now?"],
["Cybersecurity", "DLP", "Data Loss Prevention", "Controls that detect or block sensitive data leaving approved systems by email, web, USB or cloud upload.", "Customer or patient data walks out as an email attachment.", "Which data types matter most, and where do they travel today?"],
["Cybersecurity", "Phishing and BEC", "Phishing; Business Email Compromise", "Phishing is a fake message meant to steal a password or access. BEC is targeted email fraud that tricks staff into sending money or changing payment details.", "A fake invoice email moves real money.", "How is a wire or payment change verified today, outside the email thread?"],
["Cybersecurity", "Penetration Test", "Penetration test, often called a pen test", "An authorized simulated attack that shows what a skilled attacker could actually reach. A vulnerability scan is only an automated check for known weaknesses.", "An auditor or cyber insurer asks for proof of real testing.", "Have you done a real pen test or only automated scans, and who fixes what is found?"],
["Cybersecurity", "Least Privilege", "The principle of least privilege", "Giving each person or system only the access needed for the job and nothing more.", "One stolen account can reach almost everything.", "If this account were stolen, how much of the company could it reach?"],
["Cybersecurity", "VPN", "Virtual Private Network", "An encrypted tunnel that puts a remote user onto the company network, usually with broader access than modern zero trust designs.", "The tunnel is slow, keeps failing or gives too much access once a password is stolen.", "What is breaking with remote access today: speed, reliability or too much access?"],
["Cybersecurity", "Endpoint", "Endpoint device", "Any laptop, desktop, phone, server or other device that connects to the network and could be an entry point for an attacker.", "Unmanaged devices connect to company data.", "What mix of Windows, Mac, mobile and servers do you have, and who owns those devices?"],
["Infrastructure & IoT", "IoT", "Internet of Things", "Sensors, cameras and equipment that connect to a network to report data or take action, often outside the normal office computers.", "Devices nobody manages sit on the same network as company data.", "What do these devices do, can they be patched, and do they share a network with corporate data?"],
["Infrastructure & IoT", "MDM / UEM", "Mobile Device Management / Unified Endpoint Management", "Software that sets rules for company phones, tablets and laptops and can find, lock or wipe a lost one.", "A lost phone exposes company data.", "How are personal phones handled, are contractors in scope, and what happens when an employee leaves?"],
["Infrastructure & IoT", "Private 5G", "Private 5G", "A cellular network a company runs for its own campus, plant or yard instead of relying only on carrier coverage or Wi-Fi.", "Wi-Fi is unreliable across a large plant, port or yard.", "Where does coverage fail today, which devices need it, and who would run the network?"],
["Infrastructure & IoT", "eSIM", "Embedded SIM", "A SIM built into a device that can be set up remotely, so nobody has to swap a physical card.", "Trucks, kiosks and sensors lose service when one carrier has a dead zone.", "How many devices do you have, where do they travel, and what happens if one carrier has a dead zone?"],
["Infrastructure & IoT", "PoE", "Power over Ethernet", "Power and data on the same network cable, used for phones, Wi-Fi access points, cameras and sensors.", "A simple camera or Wi-Fi refresh fails because the switches cannot supply enough power.", "Can your network switches supply enough power for the new access points or cameras?"],
["Infrastructure & IoT", "Managed Wi-Fi", "Managed wireless network", "Wireless networking delivered as a service, where a provider designs coverage, supplies and monitors access points and supports it.", "Local staff cannot manage Wi-Fi across many sites.", "Which sites have weak coverage, and do you need guest access and payment devices on the same wireless network?"],
["Infrastructure & IoT", "POTS Replacement", "Plain Old Telephone Service replacement", "Moving remaining analog copper phone lines, often used for alarms, elevators and fax, onto modern alternatives.", "Carriers are retiring copper and old lines will stop working.", "Do you have an inventory of every analog line, and what does each one connect to?"],
["Infrastructure & IoT", "Life-Safety Lines", "Operational technology and life-safety circuits", "Phones and connections for fire alarms, elevator phones and access control, often still on analog copper.", "Someone disconnects copper and a fire panel or elevator phone stops working.", "Have facilities, the alarm vendor and the elevator vendor approved what can be disconnected?"],
["Infrastructure & IoT", "Copper Retirement", "Carrier retirement of old copper lines", "Carriers taking old copper networks out of service and moving customers to fiber, internet-based or wireless service.", "A carrier notice arrives and sites have weeks to move.", "Which of your sites still use analog or older digital services, and have any received a notice?"],
["Advisor & Buying", "TSD", "Technology Services Distributor", "The company that holds supplier agreements behind a technology advisor, historically called a master agent. The customer signs with the chosen provider, and the provider pays a commission that funds the advice.", "Buyers wonder how an advisor gets paid and whether the advice is fair.", "Would it help if I explained how I am paid and how we keep the comparison fair?"],
["Advisor & Buying", "RFP / RFI", "Request for Proposal / Request for Information", "An RFI learns what is available. An RFP asks suppliers for comparable proposals against a stated list of requirements.", "Quotes arrive in different shapes and cannot be compared.", "What requirements must every supplier quote on: term, SLA, install fees, install timeline and scope?"],
["Advisor & Buying", "SOW", "Statement of Work", "The document that spells out the work, the deliverables, the timeline and who is responsible for each part.", "A cheap monthly rate hides expensive extra work.", "Who does the site survey, cabling, after-hours cutover and post-cutover support, and where is that written down?"],
["Advisor & Buying", "MSA", "Master Service Agreement", "The umbrella contract with the legal terms, such as renewal and liability, under which individual orders are placed.", "Auto-renewal and price-increase rights hide in the fine print.", "Have you read the master agreement, not just the quote, for renewal, price increases and liability?"],
["Advisor & Buying", "LOA", "Letter of Agency", "A signed authorization that lets a named third party speak to current providers and request records on the buyer's behalf.", "Nobody can find out what circuits and services the company really has.", "Who can sign a letter of agency so we can review your current circuits and invoices?"],
["Advisor & Buying", "MRC / NRC", "Monthly Recurring Charge / Non-Recurring Charge", "MRC is the monthly cost. NRC is the one-time cost for install, construction or equipment.", "A low monthly price hides large one-time fees.", "What one-time charges, such as construction or equipment, sit outside the monthly price in each quote?"],
["Advisor & Buying", "Term Length", "Contract term, such as 12, 24, 36 or 60 months", "How long the buyer commits to pay. Longer terms often lower the monthly price but raise the cost of leaving.", "A long contract locks in a design the company may outgrow.", "When do current contracts end, and might any site close or be redesigned before the new term ends?"],
["Advisor & Buying", "ETF", "Early Termination Fee", "What the customer owes for canceling before the contract ends, often the remaining monthly charges plus a clawback of waived install fees.", "Leaving early costs far more than expected.", "If you leave in month 12 of 36, what exactly do you owe, and where is the formula written?"],
["Advisor & Buying", "Co-terming", "Co-terminous contracts", "Lining up end dates across sites or services so they renew together instead of on scattered anniversaries.", "Dozens of contracts renew at different times, so nothing can be renegotiated at once.", "Which contracts could be lined up to one end date, and what would getting there cost?"],
["Advisor & Buying", "Auto-Renewal", "Contract renewal and auto-renewal", "A clause that extends the contract, often for 12 months, unless written notice is given inside a set window.", "A missed notice window renews a contract at a higher rate.", "When does each contract auto-renew, and what is the notice window we cannot miss?"],
["Advisor & Buying", "TEM", "Technology Expense Management", "Taking inventory of every circuit, license and technology bill, checking it against contracts and removing waste.", "Unused lines and duplicate services keep getting paid for.", "May I review your current invoices to find unused or duplicate services?"],
["Advisor & Buying", "MACD", "Moves, Adds, Changes and Disconnects", "The everyday service changes after install, such as moving a user, adding a site or turning off a circuit.", "Every small change takes two weeks and a service ticket.", "How are changes requested today, how long do they take, and what do they cost?"],
["Advisor & Buying", "Cutover", "Cutover, FOC and migration", "Cutover is the go-live moment when traffic or users actually move. Migration is the whole move from old to new, ideally with testing and a rollback plan.", "The new service goes live badly and there is no way back.", "Who is on the call, what is tested first, including 911, and what happens if the new path fails that night?"],
["Advisor & Buying", "FOC", "Firm Order Commitment", "The date a provider commits in writing to deliver a service.", "Install dates keep slipping with nothing in writing.", "Do you have a firm order commitment date, and what happens if it slips?"],
["Compliance", "CMMC", "Cybersecurity Maturity Model Certification", "The Defense Department program that requires contractors handling sensitive government information to meet set security practices. The rules have been changing, so always check current status.", "A defense supplier could lose contracts without proof of security.", "Do you handle government contract information, and which CMMC level does your contract require today?"],
["Compliance", "NIST 800-171", "National Institute of Standards and Technology 800-171", "The set of security controls for protecting sensitive unclassified government information. It is the control set behind CMMC Level 2.", "A contractor cannot show it meets the required controls.", "How many of the 110 controls have you documented, and who maintains the evidence?"]
];

{n:"Case 1: Manufacturer (Sanjay)",sum:"A global manufacturer wants its factory machines and its business systems to share information. Sanjay leads IT. He will send an equipment list for one or two production lines so Bridgepointe can find workable options. The goal is one common backbone by December 2028.",

["Production and business data are copied by hand","Business teams use ERP (Enterprise Resource Planning) software, here SAP and Oracle, for orders and finance. The factory has no matching system, so people pull reports and pass schedules to the lines manually. This is a data silo.","A MES (Manufacturing Execution System) tracks and schedules work on the floor. Linking it to the ERP lets orders flow down to the lines and production results flow back up to sales."],
["Cloud and disaster recovery are not designed yet","The company runs three data centers (U.S., Germany, Philippines) with about 15,000 servers each. Sanjay is considering linking three private clouds for one global view, plus a separate DR (Disaster Recovery) site.","Design starts with RTO (Recovery Time Objective, how fast systems come back) and RPO (Recovery Point Objective, how much data loss is acceptable) for each system. Those targets decide the DR design and the vendors to compare."]],
